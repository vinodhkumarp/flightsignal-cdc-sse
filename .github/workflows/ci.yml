name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            server/target/surefire-reports
            server/target/failsafe-reports

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint -w web
      - run: npm run test -w web
      - run: npm run build -w web

  simulator:
    name: Database + simulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flights
          POSTGRES_USER: flights
          POSTGRES_PASSWORD: flights
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flights -d flights"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: flights
      PSQL: psql -h localhost -U flights -d flights
    steps:
      - uses: actions/checkout@v5

      - name: Apply migrations and seed data
        run: |
          for file in server/src/main/resources/db/migration/*.sql server/src/main/resources/db/seed/*.sql; do
            $PSQL -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Run two simulator cycles
        env:
          SIM_CYCLES: '2'
          SIM_STEP_SECONDS: '0.2'
          SIM_PAUSE_SECONDS: '0'
        run: sh scripts/simulate.sh

      - name: Assert flights, passengers and events were created
        run: |
          $PSQL -v ON_ERROR_STOP=1 -tA -c "
            DO \$\$
            BEGIN
              IF (SELECT count(*) FROM sim.simulated_flight) <> 2 THEN
                RAISE EXCEPTION 'expected 2 simulated flights';
              END IF;
              IF (SELECT count(*) FROM flight_passenger p
                  JOIN sim.simulated_flight s
                    ON p.carrier_code = s.carrier_code AND p.flight_number = s.flight_number
                   AND p.service_date = s.service_date) < 8 THEN
                RAISE EXCEPTION 'expected synthetic passengers';
              END IF;
              IF (SELECT count(*) FROM app_internal.flight_change_event e
                  JOIN sim.simulated_flight s USING (flight_id)) < 4 THEN
                RAISE EXCEPTION 'expected change events';
              END IF;
            END
            \$\$;"
          $PSQL -v ON_ERROR_STOP=1 -c "CALL sim.cleanup()"

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${owner}/flightsignal-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/flightsignal-web" >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.sha }}
            ${{ steps.names.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.sha }}
            ${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
